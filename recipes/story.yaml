name: story
description: Consistency — one character across scenes, via cross-frame K/V sharing (Consistent Self-Attention).
run: batch
requires: [single_stream]   # position-agnostic K/V share
inputs: [character_prompt, scene_prompts]   # scene_prompts: ["...#caption", "[NC] a scene without the character", ...]
site: {stream: all}
capture: null
condition: {kind: story, share_ratio: 0.3, share_start_frac: 0.35}
ops:
  - {op: share, tokens: image}    # post_rope: append a sampled pool of all frames' K/V
params: {guidance: 3.5, share_ratio: 0.3, share_start_frac: 0.35}
validated: spike   # A100: character consistent; sharing raises frame-pair CLIP 0.75->0.83
pipeline: pipelines/story-diffusion
paper: https://arxiv.org/abs/2405.01434
