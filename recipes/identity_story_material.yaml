name: identity_story_material
description: >-
  Art-directed story — a face-locked character (PuLID identity) across scene panels (frame-shared K/V) with ONE
  shared material as a COLOUR-BAND K/V-share (edge=2) applied to every panel. Keeps material in its colour band so
  it does not collide with the high-frequency face. OPEN-WEIGHT. NOTE: for reliable cross-scene AESTHETIC cohesion,
  a post-hoc colour grade to a shared palette is the validated lever (see notebooks/story_capstone.ipynb) — cheaper
  and stronger than an in-denoise material op.
run: batch
requires: [pulid, rope, single_stream]
inputs: [id_image, scene_prompts, ref_appearance]
condition: {kind: kv_appearance, source: ref_appearance, edge: 2, sigma: 0.35, timestep: 661}
params: {id_weight: 1.0, share_ratio: 0.3, share_start_frac: 0.35, guidance: 3.5}
validated: expressible   # DOWNGRADED from spike. The earlier "gated palette accent" result was measured with a colour-hist metric that later proved UNRELIABLE (it read material present when it was ~0, and missed it when present). The batch three-way was NOT re-tested with de-risked metrics (CLIP-to-ref / HF-match). The recommended config here mirrors the corrected identity_structure_material (edge=2 colour band, NO start_frac gate), but material-in-batch is UNVERIFIED. For cross-scene cohesion the validated approach is a post-hoc colour grade (story_capstone.ipynb: cross-panel Lab tone spread halved), not this in-denoise op. Re-test with CLIP-to-ref before trusting.
license: open-weight — PuLID + FLUX.1-dev (non-commercial)
pipeline: null
paper: composition of 2404.16022 (story-diffusion frame-share) + PuLID + 2603.26767 (K/V material)
