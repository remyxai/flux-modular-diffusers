name: identity_structure_material
description: >-
  Three-way — face-lock (PuLID identity) + reference structure (freecontrol Q-replace) + reference material as a
  COLOUR-BAND K/V-SHARE (edge=2). Composes in ONE denoise: keep material in its colour band (low edge) so it does
  not collide with the high-frequency face, and release structure smoothly (cosine) so it does not crush identity.
  Identity is the bottleneck axis. OPEN-WEIGHT.
run: identity_composed
requires: [pulid, rope, single_stream]
inputs: [id_image, ref_structure, ref_appearance, prompt]
site: {stream: single, last_n: 25}
capture: {kind: lcd_q, sigma: 0.35, timestep: 661, source: ref_structure}
condition: {kind: kv_appearance, source: ref_appearance, edge: 2, sigma: 0.35, timestep: 661}
ops:
  - {op: inject_identity}
  - {op: replace_q, tokens: image}
params: {id_weight: 1.0, S: 0.3, schedule: cosine, guidance: 4.0}
validated: spike   # A100, n=6 (3 seeds x 2 prompts), de-risked metrics (ArcFace / depth-corr / CLIP-to-ref). The three-way COMPOSES at edge=2 (colour band) + cosine S=0.3: identity 0.49-0.76 (bottleneck axis, framing-sensitive), structure d 0.83-0.96, material present (CLIP-to-ref retention ~1.07). ADDITIVITY: pairwise retentions predict the triple within tolerance (identity fits the min/bottleneck model). CORRECTION of the earlier note: the prior start_frac=0.4 "palette accent" was HOLLOW — gating pushes material≈0 (the effect was mis-read by a colour-hist metric that later proved unreliable). Also: HF material (high edge) collides with identity specifically (not structure), so edge stays LOW. Blurred/low-freq refs can DESTABILISE the triple (capstone-v1 collapse) — use a normal (sharp) ref.
license: open-weight — PuLID + FLUX.1-dev (non-commercial)
pipeline: null
paper: composition of 2404.16022 + 2511.05219 + 2603.26767
