name: identity_structure_material
description: >-
  Three-way with STRONG material — face-lock (PuLID identity) + reference structure (freecontrol Q-replace) +
  reference material via K/V-SHARE (non-Redux, so material applies WITHOUT swamping the face). The capability the
  Redux three-way could only accent. OPEN-WEIGHT.
run: identity_composed
requires: [pulid, rope, single_stream]
inputs: [id_image, ref_structure, ref_appearance, prompt]
site: {stream: single, last_n: 25}
capture: {kind: lcd_q, sigma: 0.35, timestep: 661, source: ref_structure}
condition: {kind: kv_appearance, source: ref_appearance, edge: 2, sigma: 0.35, timestep: 661}
ops:
  - {op: inject_identity}
  - {op: replace_q, tokens: image}
params: {id_weight: 1.0, S: 0.5, schedule: cosine, guidance: 4.0}
validated: expressible   # A100: SWAMPS at default (guidance 4.0) — K/V material takes over into a full-frame texture, no face. appearance_kv works STANDALONE at guidance 6.5; the three-way's low guidance (PuLID's 4.0) weakens prompt adherence so material dominates. Re-spiking guidance / kv-append strength.
license: open-weight — PuLID + FLUX.1-dev (non-commercial)
pipeline: null
paper: composition of 2404.16022 + 2511.05219 + 2603.26767
