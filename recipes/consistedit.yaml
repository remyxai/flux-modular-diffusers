name: consistedit
description: Editing — highly consistent, precise. RF-invert the source, fuse its vision tokens into the edit with a structure window.
run: edit
requires: [rope, single_stream]
inputs: [image, prompt, source_prompt, mask]   # mask: white=edit, black=keep
site: {stream: single}
capture: {kind: rf_invert}      # per-step (q,k,v) of the single blocks, keyed (block, step)
condition: null
ops:
  - {op: blend, tokens: vision}   # pre_rope: lerp source vision Q/K (structure window) + V (keep mask)
params: {guidance: 3.5, src_guidance: 1.0, consistency_strength: 0.3, max_sequence_length: 512}
validated: expressible   # faithful port of pipelines/consistedit via the shared FluxIntervention pre-rope hook — GPU-validate before trusting
pipeline: pipelines/consistedit
paper: https://arxiv.org/abs/2510.17803
