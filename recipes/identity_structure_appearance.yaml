name: identity_structure_appearance
description: >-
  Three-way in one denoise — face-lock (PuLID identity) + reference structure (freecontrol Q-replace, soft-scheduled)
  + reference appearance (Redux). Declarative because residual + multi-donor are first-class. OPEN-WEIGHT (PuLID).
  Interference (identity vs structure on the late blocks) is the open question — sweep id_weight x S x redux_scale.
run: identity_composed
requires: [pulid, rope, single_stream, redux]
inputs: [id_image, ref_structure, ref_appearance, prompt]
site: {stream: single, last_n: 25}
capture: {kind: lcd_q, sigma: 0.35, timestep: 661, source: ref_structure}
condition: {kind: redux, source: ref_appearance, mask_floor: 0.1}
ops:
  - {op: inject_identity}         # PuLID residual (double i%2 + single i%4)
  - {op: replace_q, tokens: image}   # structure (late single blocks, soft schedule)
  # appearance = the redux condition above
params: {id_weight: 1.0, S: 0.3, schedule: cosine, redux_scale: 1.0, guidance: 4.0}
validated: expressible   # three-way interference UNTESTED — validate via the Phase-2 sweep spike before trusting
license: open-weight — PuLID + FLUX.1-dev (non-commercial)
pipeline: null
paper: composition of 2404.16022 + 2511.05219 + 2603.26767
