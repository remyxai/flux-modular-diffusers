name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static checks (compile block.py, validate configs, README sections)
        run: |
          set -e
          for d in pipelines/*/; do python scripts/check_pipeline.py "$d"; done
